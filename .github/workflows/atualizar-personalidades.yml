name: Atualizar personalidades da planilha

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 6h de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar personalidades.json
        env:
          CSV_URL: ${{ secrets.PLANILHA_CSV_URL }}
        run: python scripts/gerar_personalidades.py
      - name: Salvar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add personalidades.json
          git diff --staged --quiet || (git commit -m "Atualiza personalidades.json" && git push)
